# model/ids.toml --- the VerdantUI conformance ID register (`spec = "template/2"`).
#
# Single source of truth (R1). `CONFORMANCE.md` is generated byte-for-byte by
# `prism-code build` from this file, `model/authorities.toml`, and `model/ledger.toml`.
#
# Honesty levels (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and proved by Lean's kernel in app/src/
#   open       measured and verified by host gates/benchmarks, never falsely claimed as Lean-proved

spec = "template/2"

