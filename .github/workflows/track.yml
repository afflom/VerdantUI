# Automated Upstream Engine & Studio Release Tracker (`.github/workflows/track.yml`)
# Modeled on `afflom/verdant-studio/.github/workflows/track.yml` (REQ-ENGINE-TRACKING / REQ-STUDIO-TRACKING).
# Periodically checks `afflom/verdant-engine` and `afflom/verdant-studio` for new releases/registers,
# verifies all VerdantUI ratchets, tests, benchmarks, and Pages budgets, and opens an upgrade PR.

name: track

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: track-upstream
  cancel-in-progress: false

jobs:
  track:
    name: track verdant-engine & verdant-studio upstream registers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Stage upstream engine & studio pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run track:engine -- --write || true
          npm run track:studio -- --write || true
          npm run studio:publish

      - name: Check for staged changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify full VerdantUI suite before proposing upgrade PR
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run studio:check
          npm run lint
          npm test
          npm run build:pages

      - name: Open automated upgrade pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="automation/track-upstream-$(date -u +%Y%m%d%H%M)"
          git config user.name "verdant-studio-bot"
          git config user.email "verdant-studio-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add model/ CONFORMANCE.md CHANGELOG.md docs/
          git commit -m "chore(lifecycle): sync upstream verdant-engine & verdant-studio pins"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(lifecycle): sync upstream verdant-engine & verdant-studio registers" \
            --body "Automated upgrade staged by \`.github/workflows/track.yml\` after passing \`studio:check\`, \`lint\`, \`test\`, and \`build:pages\`."
