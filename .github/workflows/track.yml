# Automated Upstream Engine & Studio Release Tracker (`.github/workflows/track.yml`)
# Modeled on `afflom/verdant-studio/.github/workflows/track.yml` (REQ-ENGINE-TRACKING / REQ-STUDIO-TRACKING).
# Periodically checks `afflom/verdant-engine` and `afflom/verdant-studio` for new releases/registers,
# runs the full Prism + ratchet + surface + physical facet + test + Pages gate, and syncs directly on `main`.

name: track

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: track-upstream
  cancel-in-progress: false

jobs:
  track:
    name: track verdant-engine & verdant-studio upstream registers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Install Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Stage upstream engine & studio pins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm run track:engine -- --write || true
          npm run track:studio -- --write || true
          npm run prism:build
          npm run studio:publish

      - name: Check for staged changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify full VerdantUI suite before committing pin sync on main
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run prism:check
          npm run prism:vectors
          npm run eval:surface
          npm run eval:facets
          npm run ratchet
          npm run studio:check
          npm run lint
          npm test
          npm run build:pages

      - name: Commit verified upstream pin sync directly on main
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "verdant-studio-bot"
          git config user.email "verdant-studio-bot@users.noreply.github.com"
          git add model/ CONFORMANCE.md CHANGELOG.md docs/ surface/
          git commit -m "chore(lifecycle): sync upstream verdant-engine & verdant-studio pins"
          git push origin main
